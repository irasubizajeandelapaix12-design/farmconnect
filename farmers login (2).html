<html>
    <head>
        <meta charset="utf-8">
        <title>farmers log in</title>
        <style>
            *{
                box-sizing: border-box;
            }
            body{
                    background-color: grey;
                    margin: 0;
                    min-height: 100vh;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                }
            .logo{
                    background: rgb(58, 59, 62);
                    width: 500px;
                    padding: 24px;
                    display: flex;
                    flex-direction: column;
                    gap: 14px;
                    border-radius: 12px;
                    box-shadow: 0 0 10px rgba(0,0,0,0.5);

                }
                .input{
                    width: 100%;
                    padding: 12px;
                    border: 1px solid #ccc;
                    border-radius: 4px;
                    border-color: black;
                }
                button{
                background-color: aqua;
                color: black;
                border: none;
                border-radius: 12px;
                width: 100%;
                height: 42px;
                cursor: pointer;
                font-weight: bold;
                text-align: center;
            }
            button:hover{
                background-color: rgb(8, 171, 106);
            }
            .paragraph{
                text-align: center;
                color: white;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <header>
       <div class="logo">
            <input type="email" placeholder="Phonenumber/Email" class="input" required>
            <input type="password" placeholder="Pass word" class="input" required>
            <p class="paragraph"><a href="register of farmers.html">Don't have an account? Register here</a></p>
            <button>SUBMIT</button>
        </div>
        </header>
    </body>
</html>
