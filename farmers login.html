<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmers Login</title>
    <style>
        body{
            background-color: grey;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            background: rgb(58, 59, 62);
            width: 800px;
            height: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            margin: auto;
            margin-top: 100px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            padding-bottom: 30px;
        }
        h1{
            text-align: center;
            color: black;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        input{
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            border-color: black;
        }
        button{
            background-color: aqua;
            color: black;
            border-radius: 12px;
            width: 90%;
            height: 40px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover{
            background-color: rgb(8, 171, 106);
        }
        .paragraph{
            color: white;
            text-align: center;
            margin: 15px 0;
        }
        .paragraph a{
            color: aqua;
            text-decoration: none;
        }
        .paragraph a:hover{
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Farmers Login</h1>
            <form>
                PHONE NUMBER/EMAIL: <br><br>
                <input type="email" placeholder="Phone number/Email" required><br><br>
                PASSWORD: <br><br>
                <input type="password" placeholder="Password" required><br><br>
                <p class="paragraph"><a href="register of farmers.html">Don't have an account? Register here</a></p>
                <button type="submit">LOGIN</button>
            </form>
        </div>
    </header>
</body>
</html>
